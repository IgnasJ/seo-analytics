# pnpm 11 moved build-script allowlisting out of package.json's "pnpm" field
# into this file's `allowBuilds` map (package -> bool). pnpm 11 hard-errors
# (ERR_PNPM_IGNORED_BUILDS) on ANY dependency whose build/install script isn't
# explicitly decided here, so every package that ships one must be listed.
#
#   msw / sharp -> false: their build scripts aren't needed here (sharp ships
#   prebuilt @img/sharp-* binaries; msw is test-only), and the app ran fine
#   without them under pnpm 10's allowlist.
allowBuilds:
  msw: false
  sharp: false
